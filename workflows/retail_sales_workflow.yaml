main:
  steps:
    - init:
        assign:
          - project_id: "retail-sales-de-srihitha"
          - location: "asia-south1"

    - build_dim_customer:
        call: googleapis.bigquery.v2.jobs.insert
        args:
          projectId: ${project_id}
          body:
            jobReference:
              projectId: ${project_id}
              location: ${location}
            configuration:
              query:
                query: |
                  CREATE OR REPLACE TABLE
                    `retail-sales-de-srihitha.analytics_gold.dim_customer` AS

                  WITH deduplicated_customers AS (
                    SELECT
                      customer_id,
                      customer_unique_id,
                      customer_zip_code_prefix,
                      customer_city,
                      customer_state,

                      ROW_NUMBER() OVER (
                        PARTITION BY customer_id
                        ORDER BY customer_id
                      ) AS row_num

                    FROM
                      `retail-sales-de-srihitha.raw_staging.olist_customers`
                  )

                  SELECT
                    ROW_NUMBER() OVER (
                      ORDER BY customer_id
                    ) AS customer_key,

                    customer_id,
                    customer_unique_id,
                    customer_zip_code_prefix,
                    customer_city,
                    customer_state

                  FROM deduplicated_customers
                  WHERE row_num = 1;
                useLegacySql: false

    - build_dim_product:
        call: googleapis.bigquery.v2.jobs.insert
        args:
          projectId: ${project_id}
          body:
            jobReference:
              projectId: ${project_id}
              location: ${location}
            configuration:
              query:
                query: |
                  CREATE OR REPLACE TABLE
                    `retail-sales-de-srihitha.analytics_gold.dim_product` AS

                  WITH deduplicated_products AS (
                    SELECT
                      product_id,

                      COALESCE(
                        product_category_name,
                        'Unknown'
                      ) AS product_category_name,

                      product_weight_g,
                      product_length_cm,
                      product_height_cm,
                      product_width_cm,

                      ROW_NUMBER() OVER (
                        PARTITION BY product_id
                        ORDER BY product_id
                      ) AS row_num

                    FROM
                      `retail-sales-de-srihitha.raw_staging.olist_products`
                  )

                  SELECT
                    ROW_NUMBER() OVER (
                      ORDER BY product_id
                    ) AS product_key,

                    product_id,
                    product_category_name,
                    product_weight_g,
                    product_length_cm,
                    product_height_cm,
                    product_width_cm

                  FROM deduplicated_products
                  WHERE row_num = 1;
                useLegacySql: false

    - build_dim_date:
        call: googleapis.bigquery.v2.jobs.insert
        args:
          projectId: ${project_id}
          body:
            jobReference:
              projectId: ${project_id}
              location: ${location}
            configuration:
              query:
                query: |
                  CREATE OR REPLACE TABLE
                    `retail-sales-de-srihitha.analytics_gold.dim_date` AS

                  WITH order_dates AS (
                    SELECT DISTINCT
                      DATE(
                        SAFE_CAST(
                          order_purchase_timestamp AS TIMESTAMP
                        )
                      ) AS full_date

                    FROM
                      `retail-sales-de-srihitha.raw_staging.olist_orders`

                    WHERE order_purchase_timestamp IS NOT NULL
                  )

                  SELECT
                    CAST(
                      FORMAT_DATE('%Y%m%d', full_date) AS INT64
                    ) AS date_key,

                    full_date,
                    EXTRACT(DAY FROM full_date) AS day,
                    EXTRACT(MONTH FROM full_date) AS month,
                    FORMAT_DATE('%B', full_date) AS month_name,
                    EXTRACT(QUARTER FROM full_date) AS quarter,
                    EXTRACT(YEAR FROM full_date) AS year,
                    FORMAT_DATE('%A', full_date) AS day_of_week

                  FROM order_dates
                  WHERE full_date IS NOT NULL
                  ORDER BY full_date;
                useLegacySql: false

    - build_fact_sales:
        call: googleapis.bigquery.v2.jobs.insert
        args:
          projectId: ${project_id}
          body:
            jobReference:
              projectId: ${project_id}
              location: ${location}
            configuration:
              query:
                query: |
                  CREATE OR REPLACE TABLE
                    `retail-sales-de-srihitha.analytics_gold.fact_sales` AS

                  WITH deduplicated_orders AS (
                    SELECT
                      order_id,
                      customer_id,
                      order_status,

                      SAFE_CAST(
                        order_purchase_timestamp AS TIMESTAMP
                      ) AS order_purchase_timestamp,

                      ROW_NUMBER() OVER (
                        PARTITION BY order_id
                        ORDER BY
                          SAFE_CAST(
                            order_purchase_timestamp AS TIMESTAMP
                          ) DESC
                      ) AS row_num

                    FROM
                      `retail-sales-de-srihitha.raw_staging.olist_orders`
                  ),

                  clean_orders AS (
                    SELECT
                      order_id,
                      customer_id,
                      order_status,
                      order_purchase_timestamp

                    FROM deduplicated_orders
                    WHERE row_num = 1
                      AND order_purchase_timestamp IS NOT NULL
                  ),

                  deduplicated_order_items AS (
                    SELECT
                      order_id,
                      order_item_id,
                      product_id,
                      SAFE_CAST(price AS NUMERIC) AS item_price,
                      SAFE_CAST(freight_value AS NUMERIC)
                        AS freight_value,

                      ROW_NUMBER() OVER (
                        PARTITION BY order_id, order_item_id
                        ORDER BY product_id
                      ) AS row_num

                    FROM
                      `retail-sales-de-srihitha.raw_staging.olist_order_items`
                  ),

                  clean_order_items AS (
                    SELECT
                      order_id,
                      order_item_id,
                      product_id,
                      item_price,
                      freight_value

                    FROM deduplicated_order_items
                    WHERE row_num = 1
                  )

                  SELECT
                    ROW_NUMBER() OVER (
                      ORDER BY
                        order_items.order_id,
                        order_items.order_item_id
                    ) AS sales_key,

                    order_items.order_id,
                    order_items.order_item_id,
                    customers.customer_key,
                    products.product_key,
                    dates.date_key,
                    orders.order_status,
                    orders.order_purchase_timestamp,

                    1 AS quantity,

                    order_items.item_price,
                    order_items.freight_value,
                    order_items.item_price AS revenue

                  FROM clean_order_items AS order_items

                  INNER JOIN clean_orders AS orders
                    ON order_items.order_id = orders.order_id

                  INNER JOIN
                    `retail-sales-de-srihitha.analytics_gold.dim_customer`
                    AS customers
                    ON orders.customer_id = customers.customer_id

                  INNER JOIN
                    `retail-sales-de-srihitha.analytics_gold.dim_product`
                    AS products
                    ON order_items.product_id = products.product_id

                  INNER JOIN
                    `retail-sales-de-srihitha.analytics_gold.dim_date`
                    AS dates
                    ON DATE(orders.order_purchase_timestamp)
                      = dates.full_date;
                useLegacySql: false

    - finish:
        return: "Retail Sales ETL completed successfully"
